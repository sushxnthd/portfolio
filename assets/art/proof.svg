<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="t d"><title id="t">Proof is a process</title><desc id="d">An original typographic poster with a five-stage verification motif. It represents replayable verification, not a certification guarantee.</desc><defs><clipPath id="art"><rect x="0" y="0" width="640" height="480"/></clipPath><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" stitchTiles="stitch"/></filter></defs><g clip-path="url(#art)"><rect x="0" y="0" width="640" height="480" fill="#e4e1d6" /><rect x="0" y="0" width="640" height="480" fill="#e4e1d6" /><rect x="24" y="26" width="592" height="428" fill="#171b1a" /><text x="43" y="53" font-family="monospace" font-size="12" fill="#b2b9ad" >08 / REPLAYABLE CLAIMS</text><text x="42" y="149" font-family="Arial, Helvetica, sans-serif" font-size="102" fill="#e4e1d6" font-weight="700" letter-spacing="-6">PROOF</text><text x="42" y="245" font-family="Arial, Helvetica, sans-serif" font-size="102" fill="#e4e1d6" font-weight="700" letter-spacing="-6">IS A</text><text x="42" y="341" font-family="Arial, Helvetica, sans-serif" font-size="95" fill="#e4e1d6" font-weight="700" letter-spacing="-5">PROCESS.</text><rect x="43" y="368" width="554" height="1" fill="#b2b9ad" /><rect x="43" y="387" width="33" height="32" fill="none" stroke="#b2b9ad" stroke-width="1"/><rect x="88" y="387" width="33" height="32" fill="none" stroke="#b2b9ad" stroke-width="1"/><rect x="133" y="387" width="33" height="32" fill="none" stroke="#b2b9ad" stroke-width="1"/><rect x="178" y="387" width="33" height="32" fill="none" stroke="#b2b9ad" stroke-width="1"/><rect x="223" y="387" width="33" height="32" fill="#dce766" stroke="#b2b9ad" stroke-width="1"/><path d="M231 402l7 7 12 -14" fill="none" stroke="#171b1a" stroke-width="2.2" opacity="1" /><text x="596" y="408" font-family="monospace" font-size="13" fill="#e4e1d6" text-anchor="end">agnXiv / REPLAY</text