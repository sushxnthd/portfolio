name: Portfolio browser smoke test

on:
  push:
    branches: [main, 'design/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check trail.js
          node --check tests/smoke.mjs
          node scripts/sync-inventory.mjs

      - name: Start local site
        run: |
          python3 -m http.server 8000 > /tmp/portfolio-server.log 2>&1 &
          sleep 2

      - name: Run browser smoke test
        run: node tests/smoke.mjs

      - name: Upload viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-viewport-screenshots
          path: qa-screenshots/
          if-no-files-found: ignore
