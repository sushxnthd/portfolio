name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

        with:
          fetch-depth: 0

      - name: Assemble production site only
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/portfolio-site"
          mkdir -p "$site"
          git archive HEAD | tar -x -C "$site"
          rm -rf "$site/previews"
          test -f "$site/index.html"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/portfolio-site

      - name: Wait for Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | grep -q '[0-9]'; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages artifact did not become visible to the Actions API"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
