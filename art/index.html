<body><a class="skip" href="#main">Skip to content</a><main class="site art-site" id="main"><header class="archive-intro"><a class="back" href="../">← Sushanth Dasari</a><h1>Field studies</h1><p>A collection of original computational graphics, made for the disappearing image trail on this site. Each is a visual interpretation of a research question or project, not a scientific result.</p></header><div class="art-grid"><figure class="art-study"><img src="../assets/art/routing.svg" width="640" height="480" alt="A warped lattice with a highlighted routing intersection; an abstract architecture study, not measured hardware." loading="lazy" decoding="async"><figcaption><span>01 / Folded topology</span><span>Kernellum</span></figcaption></figure>
<figure class="art-study"><img src="../assets/art/copycat.svg" width="640" height="480" alt="Five evaluation roots are repeated across rows; duplicated root three is marked orange. A conceptual study of weighting." loading="lazy" decoding="async"><figcaption><span>02 / Root multiplicity</span><span>CopyCAT</span></figcaption></figure>
<figure class="art-study"><img src="../assets/art/interference.svg" width="640" height="480" alt="Two superposed circular wave fields; abstract interference imagery, not quantum experimental observations." loading="lazy" decoding="async"><figcaption><span>03 / Interference field</span><span>CR-ZNE</span></figcaption></figure>
<figure class="art-study"><img src="../assets/art/signal.svg" width="640" height="480" alt="Six stylized signal traces with a highlighted response window; synthetic artwork, not a real user's biometric data." loading="lazy" decoding="async"><figcaption><span>04 / Response window</span><span>Somno</span></figcaption></figure>
<figure class="art-study"><img src="../assets/art/boundary.svg" width="640" height="480" alt="Nested geometrical boundaries surround a minimal exposed signal; a visual metaphor for bounded disclosure." loading="lazy" decoding="async"><figcaption><span>05 / Containment</span><span>Hush</span></figcaption></figure>
<figure class="art-study"><img src="../assets/art/orbit.svg" width="640" height="480" alt="An orbit of transformed rectangles with one distinct state; an abstract study of algebraic transformations." loading="lazy" decoding="async"><figcaption><span>06 / Algebraic orbit</span><span>Theorica</span></figcaption></figure>
<figure class="art-study"><img src="../assets/art/fabric.svg" width="640" height="480" alt="Isometric array of abstract compute cells with variable heights, not a physical die or measured performance." loading="lazy" decoding="async"><figcaption><span>07 / Compute fabric</span><span>Vektor</span></figcaption></figure>
<figure class="art-study"><img src="../assets/art/proof.svg" width="640" height="480" alt="An original typographic poster with a five-stage verification motif. It represents replayable verification, not a certification guarantee." loading="lazy" decoding="async"><figcaption><span>08 / Proof is a process</span><span>agnXiv</span></figcaption></figure>
<figure class="art-study"><img src="../assets/art/latent.svg" width="640" height="480" alt="A family of mathematically generated closed orbits, representing transition closure as a visual metaphor." loading="lazy" decoding="async"><figcaption><span>09 / Latent dynamics</span><span>NOESIS</span></figcaption></figure>
<figure class="art-study"><img src="../assets/art/refinement.svg" width="640" height="480" alt="The same four blocks shown as a finer sequence, illustrating changes in tool granularity without asserting a particular score." loading="lazy" decoding="async"><figcaption><span>10 / Invariant under refinement</span><span>GRIT</span></figcaption></figure>
<figure class="art-study"><img src="../assets/art/density.svg" width="640" height="480" alt="A deterministic halftone density pattern, not a measured distribution of agent traces." loading="lazy" decoding="async"><figcaption><span>11 / Trace density</span><span>Trace Corpus</span></figcaption></figure>
<figure class="art-study"><img src="../assets/art/events.svg" width="640" height="480" alt="Abstract routed state changes, inspired by reversible retail events." loading="lazy" decoding="async"><figcaption><span>12 / Event model</span><span>Green Groove</span></figcaption></figure>
<figure class="art-study"><img src="../assets/art/contours.svg" width="640" height="480" alt="Nested mathematical contour lines with a marked envelope. This is a decorative study, not a bound from experimental results." loading="lazy" decoding="async"><figcaption><span>13 / Calibration envelope</span><span>CR-ZNE</span></figcaption></figure>
